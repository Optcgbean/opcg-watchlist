<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPCG Watchlist Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🃏 OPCG 15-Card Watchlist</h1>
                <div class="meta">
                    <span class="timestamp">Last Updated: <span id="lastUpdated">Loading...</span></span>
                    <span class="currency">Currency: HKD (SGD × 5.8)</span>
                </div>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Cards</button>
                <button class="filter-btn" data-filter="gainers">🔥 Gainers (>5%)</button>
                <button class="filter-btn" data-filter="losers">📉 Losers (<-5%)</button>
            </div>
        </header>

        <main>
            <div class="stats-bar">
                <div class="stat">
                    <span class="stat-label">Total Cards</span>
                    <span class="stat-value" id="totalCards">15</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Avg PSA10 Ask</span>
                    <span class="stat-value" id="avgAsk">Calculating...</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Portfolio Value</span>
                    <span class="stat-value" id="portfolioValue">—</span>
                </div>
            </div>

            <div class="cards-grid" id="cardsGrid">
                <!-- Cards populated by JavaScript -->
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <p>No cards match the current filter.</p>
            </div>
        </main>

        <footer>
            <p>Data sourced from SNKRDUNK • Updates daily at 8:37 AM HKT</p>
            <p class="disclaimer">For investment tracking purposes only. Not financial advice.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
